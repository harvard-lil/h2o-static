name: Test, Build, and Deploy

on:
  [push, pull_request]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    # don't run on pushes to forks
    if: github.event_name == 'pull_request' || github.repository == 'harvard-lil/h2o-static'

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v4
        with:
          path: bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('app/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Info
        run: |
          docker version
          npm --version

      - name: Setup
        run: |
          npm install vnu-jar
          sudo mkdir -m 777 build
          ls bundle || sudo mkdir -m 777 bundle
          sudo mkdir -m 777 app/.jekyll-cache

      - name: Test and build
        run: |
          bash ./scripts/run-tests.sh

      - name: Prepare Cloudflare Pages output
        run: cp build/404/index.html build/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build/

  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: cloudflare-pages
      url: https://about.opencasebook.org
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build/

      - name: Deploy to Cloudflare Pages
        uses: harvard-lil/lil-actions/cloudflare-pages-deploy@main
        with:
          project-name: h2o-static
          directory: build
          branch: develop
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
              {
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*H2O Static site deployed successfully!*"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                                    "text": "*Repo:*\n<https://github.com/${{ github.repository }}|`${{ github.repository }}`>\n*Branch:*\n<https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}|`${{ github.ref_name }}`>\n*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                    } 
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*View the site:* <https://about.opencasebook.org|https://about.opencasebook.org>"
                    }
                  }
                ]
              }
